<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>image-scope</title>
    <link data-trunk rel="rust" data-wasm-opt="s" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #282828; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
      #loading {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #bbb; font: 16px system-ui, sans-serif; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading image-scope…</div>
    <canvas id="bevy" tabindex="0"></canvas>
    <script>
      // Événement émis par le chargeur de Trunk une fois le wasm démarré.
      addEventListener("TrunkApplicationStarted", () => document.getElementById("loading").remove());
    </script>
  </body>
</html>
